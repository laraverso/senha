<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Fila</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #1a1a1a;
            color: #999;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.ativo {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        /* PAINEL */
        .painel {
            display: none;
        }

        .painel.ativo {
            display: block;
        }

        .painel h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .main-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .display-numero {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .display-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .info-block {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .info-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 32px;
            font-weight: bold;
        }

        .controles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .controle-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .controle-titulo {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-proximo {
            background: #28a745;
            color: white;
            width: 100%;
            font-size: 16px;
            padding: 15px;
        }

        .btn-proximo:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            width: 100%;
            padding: 15px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        /* QR CODE */
        .qrcode-page {
            display: none;
        }

        .qrcode-page.ativo {
            display: block;
        }

        .qrcode-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
            color: #333;
        }

        .qrcode-container h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .qrcode-display {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 2px dashed #667eea;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        .qr-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .qr-stat-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
        }

        .qr-stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .qr-stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .qr-url {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            word-break: break-all;
            font-size: 12px;
            color: #333;
            border: 1px solid #667eea;
        }

        .mensagem {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .mensagem.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .display-numero {
                font-size: 60px;
            }

            .main-display {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn ativo" onclick="mudarAba('painel')">🎫 Painel</button>
            <button class="tab-btn" onclick="mudarAba('qrcode')">📱 QR Code</button>
        </div>

        <div id="mensagem" class="mensagem"></div>

        <!-- PAINEL -->
        <div id="painel" class="painel ativo">
            <h1>🎫 Painel de Atendimento</h1>

            <div class="main-display">
                <div style="font-size: 18px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;">Atualmente Atendendo</div>
                <div class="display-numero" id="senhaAtualDisplay">000</div>
                <div class="display-info">
                    <div class="info-block">
                        <div class="info-label">Próxima Senha</div>
                        <div class="info-value" id="proxSenhaDisplay">000</div>
                    </div>
                    <div class="info-block">
                        <div class="info-label">Na Fila</div>
                        <div class="info-value" id="naFila">0</div>
                    </div>
                </div>
            </div>

            <div class="controles">
                <div class="controle-card">
                    <div class="controle-titulo">⬆️ Próxima Senha</div>
                    <button class="btn-proximo" onclick="proximaSenha()">Chamar Próximo (ESPAÇO)</button>
                </div>

                <div class="controle-card">
                    <div class="controle-titulo">✏️ Atualizar Manualmente</div>
                    <div class="input-container">
                        <input type="number" id="inputSenha" min="0" max="999" placeholder="Número">
                        <button class="btn-primary btn-small" onclick="atualizarSenhaAtual()">OK</button>
                    </div>
                </div>

                <div class="controle-card">
                    <div class="controle-titulo">🔄 Reset</div>
                    <button class="btn-danger" onclick="resetarComConfirmacao()">Resetar Sistema</button>
                </div>
            </div>
        </div>

        <!-- QR CODE -->
        <div id="qrcode-page" class="qrcode-page">
            <div class="qrcode-container">
                <h1>🎫 Gerador de Senha</h1>
                <p style="color: #666; margin-bottom: 30px;">Escaneie este QR Code com seu celular</p>

                <div class="qrcode-display">
                    <div id="qrcode"></div>
                </div>

                <div class="qr-url" id="urlDisplay"></div>

                <div class="qr-stats">
                    <div class="qr-stat-box">
                        <div class="qr-stat-label">Próxima Senha</div>
                        <div class="qr-stat-value" id="qr-proxSenha">000</div>
                    </div>
                    <div class="qr-stat-box">
                        <div class="qr-stat-label">Sendo Atendido</div>
                        <div class="qr-stat-value" id="qr-senhaAtual">000</div>
                    </div>
                </div>

                <button class="btn-primary" onclick="atualizarQR()" style="margin-bottom: 10px;">🔄 Atualizar QR</button>
                <button class="btn-danger" onclick="resetarQR()">⚠️ Reset</button>
            </div>
        </div>
    </div>

    <script>
        // ===== SISTEMA COM LOCALSTORAGE =====
        class SistemaPassword {
            constructor() {
                this.initDados();
            }

            initDados() {
                if (!localStorage.getItem('sistemaSenha')) {
                    localStorage.setItem('sistemaSenha', JSON.stringify({
                        proximaSenha: 0,
                        senhaAtual: 0,
                        ultimoReset: new Date().toLocaleDateString('pt-BR')
                    }));
                }
            }

            getDados() {
                return JSON.parse(localStorage.getItem('sistemaSenha') || '{"proximaSenha":0,"senhaAtual":0}');
            }

            saveDados(dados) {
                localStorage.setItem('sistemaSenha', JSON.stringify(dados));
                // Dispara evento para sincronização
                window.dispatchEvent(new StorageEvent('storage', {
                    key: 'sistemaSenha',
                    newValue: JSON.stringify(dados)
                }));
            }

            async incrementarProximaSenha() {
                const dados = this.getDados();
                dados.proximaSenha++;
                this.saveDados(dados);
                return dados.proximaSenha;
            }

            async obterProximaSenha() {
                return this.getDados().proximaSenha;
            }

            async obterSenhaAtual() {
                return this.getDados().senhaAtual;
            }

            async setSenhaAtual(numero) {
                const dados = this.getDados();
                dados.senhaAtual = numero;
                this.saveDados(dados);
                return dados;
            }

            async resetarSistema() {
                const dados = {
                    proximaSenha: 0,
                    senhaAtual: 0,
                    ultimoReset: new Date().toLocaleDateString('pt-BR')
                };
                this.saveDados(dados);
                return dados;
            }
        }

        const sistema = new SistemaPassword();

        // ===== NAVEGAÇÃO =====
        function mudarAba(aba) {
            document.querySelectorAll('[id$="-page"], .painel').forEach(el => el.classList.remove('ativo'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('ativo'));

            if (aba === 'painel') {
                document.getElementById('painel').classList.add('ativo');
            } else if (aba === 'qrcode') {
                document.getElementById('qrcode-page').classList.add('ativo');
                inicializarQR();
            }

            event.target.classList.add('ativo');
        }

        // ===== PAINEL =====
        async function proximaSenha() {
            const senhaAtual = await sistema.obterSenhaAtual();
            const proximaSenha = await sistema.obterProximaSenha();

            if (proximaSenha > senhaAtual) {
                await sistema.setSenhaAtual(senhaAtual + 1);
                mostrarMensagem('✓ Chamando: ' + String(senhaAtual + 1).padStart(3, '0'));
                tocarSom();
                atualizarPainel();
            }
        }

        async function atualizarSenhaAtual() {
            const valor = parseInt(document.getElementById('inputSenha').value);
            if (isNaN(valor) || valor < 0 || valor > 999) {
                mostrarMensagem('⚠️ Número inválido');
                return;
            }
            await sistema.setSenhaAtual(valor);
            document.getElementById('inputSenha').value = '';
            mostrarMensagem('✓ Senha: ' + String(valor).padStart(3, '0'));
            atualizarPainel();
        }

        async function resetarComConfirmacao() {
            if (confirm('Tem certeza?') && confirm('CONFIRMAÇÃO: Reset irá zerar tudo!')) {
                await sistema.resetarSistema();
                mostrarMensagem('✓ Sistema resetado!');
                atualizarPainel();
            }
        }

        async function atualizarPainel() {
            const proxSenha = await sistema.obterProximaSenha();
            const senhaAtual = await sistema.obterSenhaAtual();

            document.getElementById('senhaAtualDisplay').textContent = String(senhaAtual).padStart(3, '0');
            document.getElementById('proxSenhaDisplay').textContent = String(proxSenha).padStart(3, '0');
            document.getElementById('naFila').textContent = Math.max(0, proxSenha - senhaAtual);
        }

        // ===== QR CODE =====
        async function inicializarQR() {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            
            const urlBase = window.location.href.split('?')[0].split('#')[0];
            const urlCliente = urlBase + 'cliente.html';
            
            document.getElementById('urlDisplay').textContent = 'URL para clientes: ' + urlCliente;
            
            qrCode = new QRCode(container, {
                text: urlCliente,
                width: 250,
                height: 250,
                colorDark: '#667eea',
                colorLight: '#ffffff'
            });

            atualizarQR();
            setInterval(atualizarQR, 5000);
        }

        async function atualizarQR() {
            const proxSenha = await sistema.obterProximaSenha();
            const senhaAtual = await sistema.obterSenhaAtual();

            document.getElementById('qr-proxSenha').textContent = String(proxSenha).padStart(3, '0');
            document.getElementById('qr-senhaAtual').textContent = String(senhaAtual).padStart(3, '0');
        }

        async function resetarQR() {
            if (confirm('Tem certeza?')) {
                await sistema.resetarSistema();
                atualizarQR();
                mostrarMensagem('✓ Resetado!');
            }
        }

        // ===== UTILITÁRIOS =====
        function mostrarMensagem(texto) {
            const msg = document.getElementById('mensagem');
            msg.textContent = texto;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function tocarSom() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + 0.5);
            } catch (e) {}
        }

        // Atalho ESPAÇO
        document.addEventListener('keypress', (e) => {
            if (e.key === ' ' && document.getElementById('painel').classList.contains('ativo')) {
                e.preventDefault();
                proximaSenha();
            }
        });

        // Sincroniza entre abas
        window.addEventListener('storage', (e) => {
            if (e.key === 'sistemaSenha') {
                atualizarPainel();
            }
        });

        // ===== INICIALIZAÇÃO =====
        atualizarPainel();
        setInterval(atualizarPainel, 1000);
    </script>
</body>
</html>
