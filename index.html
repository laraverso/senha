<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .info-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .info-header-item {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .info-header-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .info-header-value {
            font-size: 40px;
            font-weight: bold;
            color: #667eea;
        }

        .main-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .display-label {
            font-size: 18px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .display-numero {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .controle-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .controle-titulo {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-proximo {
            background: #28a745;
            color: white;
            width: 100%;
            font-size: 16px;
            padding: 15px;
        }

        .btn-proximo:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            width: 100%;
            padding: 15px;
        }

        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        .qrcode-section {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .qrcode-section h3 {
            color: #999;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .mensagem {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .mensagem.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tempo-atualizacao {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .display-numero {
                font-size: 60px;
            }

            .main-display {
                padding: 30px;
            }

            .controles {
                grid-template-columns: 1fr;
            }

            .info-header {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Painel de Atendimento</h1>
        </div>

        <div id="mensagem" class="mensagem"></div>

        <div class="info-header">
            <div class="info-header-item">
                <div class="info-header-label">Próxima Senha</div>
                <div class="info-header-value" id="proxSenhaDisplay">000</div>
            </div>
            <div class="info-header-item">
                <div class="info-header-label">Atendendo</div>
                <div class="info-header-value" id="senhaAtualDisplay">000</div>
            </div>
            <div class="info-header-item">
                <div class="info-header-label">Na Fila</div>
                <div class="info-header-value" id="naFila">0</div>
            </div>
        </div>

        <div class="main-display">
            <div class="display-label">Número Atual</div>
            <div class="display-numero" id="senhaAtualBig">000</div>
        </div>

        <div class="controles">
            <div class="controle-card">
                <div class="controle-titulo">⬆️ Próxima Senha</div>
                <button class="btn-proximo" onclick="proximaSenha()">Chamar Próximo</button>
            </div>

            <div class="controle-card">
                <div class="controle-titulo">✏️ Atualizar Manualmente</div>
                <div class="input-container">
                    <input type="number" id="inputSenha" min="0" max="999" placeholder="Número">
                    <button class="btn-primary btn-small" onclick="atualizarSenhaAtual()">OK</button>
                </div>
            </div>

            <div class="controle-card">
                <div class="controle-titulo">🔄 Reset</div>
                <button class="btn-danger" onclick="resetarComConfirmacao()">Resetar Sistema</button>
            </div>
        </div>

        <div class="qrcode-section">
            <h1 style="margin-bottom: 30px; font-size: 48px;">📱 QR Code</h1>
            <p style="color: #999; margin-bottom: 30px; font-size: 16px;">Escaneie este QR Code com seu celular</p>
            <div id="qrcode"></div>
        </div>

        <div class="tempo-atualizacao" id="tempoAtualizacao"></div>
    </div>

    <script>
        class SistemaPassword {
            constructor() {
                this.initDados();
            }

            initDados() {
                if (!localStorage.getItem('sistemaSenha')) {
                    localStorage.setItem('sistemaSenha', JSON.stringify({
                        proximaSenha: 0,
                        senhaAtual: 0,
                        ultimoReset: new Date().toLocaleDateString('pt-BR')
                    }));
                }
            }

            getDados() {
                return JSON.parse(localStorage.getItem('sistemaSenha') || '{"proximaSenha":0,"senhaAtual":0}');
            }

            saveDados(dados) {
                localStorage.setItem('sistemaSenha', JSON.stringify(dados));
                window.dispatchEvent(new StorageEvent('storage', {
                    key: 'sistemaSenha',
                    newValue: JSON.stringify(dados)
                }));
            }

            async obterProximaSenha() {
                return this.getDados().proximaSenha;
            }

            async obterSenhaAtual() {
                return this.getDados().senhaAtual;
            }

            async setSenhaAtual(numero) {
                const dados = this.getDados();
                dados.senhaAtual = numero;
                this.saveDados(dados);
                return dados;
            }

            async resetarSistema() {
                const dados = {
                    proximaSenha: 0,
                    senhaAtual: 0,
                    ultimoReset: new Date().toLocaleDateString('pt-BR')
                };
                this.saveDados(dados);
                return dados;
            }
        }

        const sistema = new SistemaPassword();

        async function proximaSenha() {
            const senhaAtual = await sistema.obterSenhaAtual();
            const proximaSenha = await sistema.obterProximaSenha();

            if (proximaSenha > senhaAtual) {
                await sistema.setSenhaAtual(senhaAtual + 1);
                mostrarMensagem('✓ Chamando: ' + String(senhaAtual + 1).padStart(3, '0'));
                tocarSom();
                atualizarPainel();
            }
        }

        async function atualizarSenhaAtual() {
            const valor = parseInt(document.getElementById('inputSenha').value);
            if (isNaN(valor) || valor < 0 || valor > 999) {
                mostrarMensagem('⚠️ Número inválido');
                return;
            }
            await sistema.setSenhaAtual(valor);
            document.getElementById('inputSenha').value = '';
            mostrarMensagem('✓ Senha: ' + String(valor).padStart(3, '0'));
            atualizarPainel();
        }

        async function resetarComConfirmacao() {
            if (confirm('Tem certeza?') && confirm('CONFIRMAÇÃO: Reset irá zerar tudo!')) {
                await sistema.resetarSistema();
                mostrarMensagem('✓ Sistema resetado!');
                atualizarPainel();
            }
        }

        async function atualizarPainel() {
            const proxSenha = await sistema.obterProximaSenha();
            const senhaAtual = await sistema.obterSenhaAtual();

            document.getElementById('senhaAtualDisplay').textContent = String(senhaAtual).padStart(3, '0');
            document.getElementById('senhaAtualBig').textContent = String(senhaAtual).padStart(3, '0');
            document.getElementById('proxSenhaDisplay').textContent = String(proxSenha).padStart(3, '0');
            document.getElementById('naFila').textContent = Math.max(0, proxSenha - senhaAtual);
            
            const agora = new Date();
            document.getElementById('tempoAtualizacao').textContent = 'Atualizado: ' + agora.toLocaleTimeString('pt-BR');
        }

        function mostrarMensagem(texto) {
            const msg = document.getElementById('mensagem');
            msg.textContent = texto;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        function tocarSom() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + 0.5);
            } catch (e) {}
        }

        function inicializarQR() {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            
            const urlBase = window.location.href.split('?')[0].split('#')[0];
            const urlCliente = urlBase + 'cliente.html';
            
            new QRCode(container, {
                text: urlCliente,
                width: 250,
                height: 250,
                colorDark: '#667eea',
                colorLight: '#ffffff'
            });
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'sistemaSenha') {
                atualizarPainel();
            }
        });

        atualizarPainel();
        setInterval(atualizarPainel, 1000);
        inicializarQR();
    </script>
</body>
</html>
