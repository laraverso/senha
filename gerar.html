<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Senha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 50px;
            font-weight: 500;
        }

        .botao {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 25px 50px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .botao:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .botao:active {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 50px 35px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 15px;
            }

            .subtitle {
                font-size: 17px;
                margin-bottom: 45px;
            }

            .botao {
                padding: 22px 45px;
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
                border-radius: 25px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 12px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 35px;
            }

            .botao {
                padding: 18px 35px;
                font-size: 18px;
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎟️ Gerar Senha</h1>
        <p class="subtitle">Clique para gerar sua senha</p>
        <button class="botao" onclick="gerarSenha()">GERAR SENHA</button>
    </div>

    <script>
        function gerarSenha() {
            // Carrega dados
            let dados = JSON.parse(localStorage.getItem('dados') || '{"senhaAtual":0,"proxSenha":0}');
            
            // Incrementa a próxima senha
            dados.proxSenha++;
            
            // Salva
            localStorage.setItem('dados', JSON.stringify(dados));
            
            // Salva qual é a minha senha
            localStorage.setItem('meuNumero', dados.proxSenha);
            
            // Dispara evento
            window.dispatchEvent(new Event('storage'));
            
            // Redireciona para a página de visualização
            window.location.href = 'cliente.html';
        }
    </script>
</body>
</html>
