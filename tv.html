<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: center;
            height: 100vh;
        }

        /* LADO ESQUERDO - Número Grande */
        .grande {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 40px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .label {
            font-size: 28px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .numero-grande {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* LADO DIREITO */
        .lado-direito {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            color: #333;
        }

        .card-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .card-numero {
            font-size: 60px;
            font-weight: 900;
            color: #667eea;
        }

        .qrcode-box {
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
        }

        .qrcode-box h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-mini {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        .info-mini-label {
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .info-mini-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                gap: 30px;
            }

            .numero-grande {
                font-size: 100px;
            }

            .grande {
                padding: 40px;
            }
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                gap: 30px;
            }

            .numero-grande {
                font-size: 120px;
                letter-spacing: 15px;
            }

            .grande {
                padding: 40px;
            }

            .label {
                font-size: 24px;
            }

            .lado-direito {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .container {
                gap: 20px;
                padding: 20px;
                height: auto;
            }

            .grande {
                padding: 30px 20px;
                border-radius: 25px;
            }

            .numero-grande {
                font-size: 80px;
                letter-spacing: 12px;
                margin: 20px 0;
            }

            .label {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .lado-direito {
                gap: 15px;
            }

            .info-row {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .info-mini {
                padding: 15px;
                border-radius: 15px;
            }

            .info-mini-label {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .info-mini-value {
                font-size: 36px;
            }

            .qrcode-box {
                padding: 20px;
                border-radius: 20px;
            }

            .qrcode-box h3 {
                font-size: 13px;
                margin-bottom: 15px;
            }

            #qrcode {
                display: flex;
                justify-content: center;
            }

            #qrcode img {
                max-width: 100%;
                height: auto;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 15px;
                padding: 10px;
            }

            .grande {
                padding: 20px 15px;
                border-radius: 20px;
            }

            .numero-grande {
                font-size: 60px;
                letter-spacing: 10px;
                padding: 20px 0;
                margin: 15px 0;
            }

            .label {
                font-size: 16px;
                margin-bottom: 10px;
            }

            .lado-direito {
                gap: 12px;
            }

            .info-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .info-mini {
                padding: 12px;
                border-radius: 12px;
            }

            .info-mini-label {
                font-size: 10px;
            }

            .info-mini-value {
                font-size: 28px;
            }

            .qrcode-box {
                padding: 15px;
                border-radius: 15px;
            }

            .qrcode-box h3 {
                font-size: 12px;
                margin-bottom: 12px;
            }

            #qrcode {
                transform: scale(0.85);
                transform-origin: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ESQUERDA - Número Grande -->
        <div class="grande">
            <div class="label">🎫 Atendendo</div>
            <div class="numero-grande" id="senhaAtual">000</div>
        </div>

        <!-- DIREITA -->
        <div class="lado-direito">
            <!-- Próxima e Fila -->
            <div class="info-row">
                <div class="info-mini">
                    <div class="info-mini-label">Próxima</div>
                    <div class="info-mini-value" id="proxSenha">000</div>
                </div>
                <div class="info-mini">
                    <div class="info-mini-label">Na Fila</div>
                    <div class="info-mini-value" id="naFila">0</div>
                </div>
            </div>

            <!-- QR Code -->
            <div class="qrcode-box">
                <h3>📱 Escaneie para gerar sua senha</h3>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <script>
        let dados = {
            senhaAtual: 0,
            proxSenha: 0
        };

        function carregar() {
            const saved = localStorage.getItem('dados');
            if (saved) dados = JSON.parse(saved);
        }

        function atualizar_tela() {
            document.getElementById('senhaAtual').textContent = String(dados.senhaAtual).padStart(3, '0');
            document.getElementById('proxSenha').textContent = String(dados.proxSenha).padStart(3, '0');
            document.getElementById('naFila').textContent = Math.max(0, dados.proxSenha - dados.senhaAtual);
        }

        function gerarQR() {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            const url = window.location.href.split('tv.html')[0] + 'gerar.html';
            new QRCode(container, {
                text: url,
                width: 250,
                height: 250,
                colorDark: '#667eea',
                colorLight: '#ffffff'
            });
        }

        window.addEventListener('storage', () => {
            carregar();
            atualizar_tela();
        });

        carregar();
        atualizar_tela();
        gerarQR();
        setInterval(atualizar_tela, 1000);
    </script>
</body>
</html>
