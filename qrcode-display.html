<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Gerador de Senha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4);
            padding: 60px;
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 48px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            margin-bottom: 50px;
            font-size: 20px;
            font-weight: 500;
        }

        .qrcode-box {
            background: #f8f9fa;
            padding: 40px;
            border-radius: 20px;
            border: 3px dashed #667eea;
            margin-bottom: 40px;
            display: inline-block;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            max-width: 100%;
            height: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .stat-item {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 15px;
        }

        .stat-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
                margin-bottom: 30px;
            }

            .qrcode-box {
                padding: 30px;
            }

            .stat-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎟️ Gerador de Senha</h1>
        <p class="subtitle">Escaneie este QR Code com seu celular</p>

        <div class="qrcode-box">
            <div id="qrcode"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Próxima Senha</div>
                <div class="stat-value" id="proxSenha">000</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Sendo Atendido</div>
                <div class="stat-value" id="senhaAtual">000</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        class SistemaPassword {
            constructor() {
                this.initDados();
            }

            initDados() {
                if (!localStorage.getItem('sistemaSenha')) {
                    localStorage.setItem('sistemaSenha', JSON.stringify({
                        proximaSenha: 0,
                        senhaAtual: 0,
                        ultimoReset: new Date().toLocaleDateString('pt-BR')
                    }));
                }
            }

            getDados() {
                return JSON.parse(localStorage.getItem('sistemaSenha') || '{"proximaSenha":0,"senhaAtual":0}');
            }

            async obterProximaSenha() {
                return this.getDados().proximaSenha;
            }

            async obterSenhaAtual() {
                return this.getDados().senhaAtual;
            }
        }

        const sistema = new SistemaPassword();

        function inicializarQR() {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            
            const urlBase = window.location.href.split('?')[0].split('#')[0];
            const urlCliente = urlBase + 'cliente.html';
            
            new QRCode(container, {
                text: urlCliente,
                width: 300,
                height: 300,
                colorDark: '#667eea',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        async function atualizarStats() {
            const proxSenha = await sistema.obterProximaSenha();
            const senhaAtual = await sistema.obterSenhaAtual();

            document.getElementById('proxSenha').textContent = String(proxSenha).padStart(3, '0');
            document.getElementById('senhaAtual').textContent = String(senhaAtual).padStart(3, '0');
        }

        window.addEventListener('storage', () => {
            atualizarStats();
        });

        // Inicializa
        inicializarQR();
        atualizarStats();
        setInterval(atualizarStats, 1000);
    </script>
</body>
</html>
