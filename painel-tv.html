<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV - Sistema de Fila</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            align-items: center;
        }

        /* PAINEL PRINCIPAL */
        .painel-principal {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 40px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .painel-label {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 300;
        }

        .numero-grande {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* PAINEL LATERAL */
        .painel-info {
            display: flex;
            flex-direction: column;
            gap: 30px;
            height: 100%;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-label {
            color: #999;
            font-size: 16px;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .card-numero {
            font-size: 80px;
            font-weight: 900;
            color: #667eea;
            line-height: 1;
        }

        .card-label-small {
            color: #999;
            font-size: 13px;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .card-valor {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }

        /* RESPONSIVO */
        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .painel-principal {
                padding: 40px;
            }

            .numero-grande {
                font-size: 120px;
            }

            .card-numero {
                font-size: 60px;
            }

            .card-valor {
                font-size: 36px;
            }
        }

        @media (max-width: 768px) {
            .painel-principal {
                padding: 30px;
            }

            .numero-grande {
                font-size: 80px;
            }

            .painel-label {
                font-size: 18px;
            }

            .card-numero {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- PAINEL PRINCIPAL -->
        <div class="painel-principal">
            <div class="painel-label">🎫 Atendendo</div>
            <div class="numero-grande" id="senhaAtual">000</div>
        </div>

        <!-- PAINEL LATERAL -->
        <div class="painel-info">
            <div class="info-card">
                <div class="card-label">Próxima Senha</div>
                <div class="card-numero" id="proxSenha">000</div>
            </div>

            <div class="info-card">
                <div class="card-label">Clientes</div>
                <div class="card-label-small">Na Fila</div>
                <div class="card-valor" id="naFila">0</div>
            </div>

            <div class="info-card">
                <div class="card-label-small" style="margin-top: 0; margin-bottom: 10px;">Última atualização</div>
                <div id="ultimaAtualizacao" style="font-size: 14px; color: #999;">--:--:--</div>
            </div>
        </div>
    </div>

    <script>
        // ===== SISTEMA COM LOCALSTORAGE =====
        class SistemaPassword {
            constructor() {
                this.initDados();
            }

            initDados() {
                if (!localStorage.getItem('sistemaSenha')) {
                    localStorage.setItem('sistemaSenha', JSON.stringify({
                        proximaSenha: 0,
                        senhaAtual: 0,
                        ultimoReset: new Date().toLocaleDateString('pt-BR')
                    }));
                }
            }

            getDados() {
                return JSON.parse(localStorage.getItem('sistemaSenha') || '{"proximaSenha":0,"senhaAtual":0}');
            }

            saveDados(dados) {
                localStorage.setItem('sistemaSenha', JSON.stringify(dados));
            }

            async obterProximaSenha() {
                return this.getDados().proximaSenha;
            }

            async obterSenhaAtual() {
                return this.getDados().senhaAtual;
            }
        }

        const sistema = new SistemaPassword();

        async function atualizarDisplay() {
            const proxSenha = await sistema.obterProximaSenha();
            const senhaAtual = await sistema.obterSenhaAtual();

            document.getElementById('senhaAtual').textContent = String(senhaAtual).padStart(3, '0');
            document.getElementById('proxSenha').textContent = String(proxSenha).padStart(3, '0');
            document.getElementById('naFila').textContent = Math.max(0, proxSenha - senhaAtual);

            const agora = new Date();
            document.getElementById('ultimaAtualizacao').textContent = agora.toLocaleTimeString('pt-BR');
        }

        // Atualiza a cada 1 segundo
        atualizarDisplay();
        setInterval(atualizarDisplay, 1000);

        // Sincroniza entre abas
        window.addEventListener('storage', (e) => {
            if (e.key === 'sistemaSenha') {
                atualizarDisplay();
            }
        });
    </script>
</body>
</html>
